<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philip Ndege · Class of 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --black:#060509; --deep:#0d0a0f; --cream:#f3e9d6; --gold:#d4b06a; --gold-soft:rgba(212,176,106,.35);
  --brown:#8a6f55; --muted:#b9a68a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#1a1220 0%,#0b0810 45%,var(--black) 100%);
  color:var(--cream);font-family:"Source Sans 3",system-ui,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#galaxy{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#galaxy canvas{display:block;width:100%;height:100%}
.glow{position:fixed;left:50%;top:48%;width:min(900px,120vw);height:min(900px,120vw);transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(212,176,106,.13),rgba(138,111,85,.06) 40%,transparent 68%);z-index:0;pointer-events:none}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;perspective:1200px}
.card{position:relative;width:min(560px,100%);padding:56px 44px 44px;text-align:center;border-radius:28px;
  background:linear-gradient(160deg,rgba(243,233,214,.09),rgba(14,10,16,.2) 55%,rgba(212,176,106,.05));
  -webkit-backdrop-filter:blur(7px) saturate(150%);backdrop-filter:blur(7px) saturate(150%);
  border:1px solid var(--gold-soft);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 1px 0 rgba(255,255,255,.18) inset,0 0 60px rgba(212,176,106,.16),0 40px 90px rgba(0,0,0,.6);
  transition:transform .25s ease-out;transform-style:preserve-3d;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,244,220,.16),transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.constel{position:absolute;pointer-events:none;opacity:.8}
.constel.tl{top:14px;left:14px;width:120px}
.constel.br{bottom:14px;right:14px;width:130px;transform:rotate(180deg)}
.constel line{stroke:var(--gold);stroke-opacity:.35;stroke-width:.6}
.constel circle{fill:var(--cream);animation:tw 3.2s ease-in-out infinite}
.constel circle:nth-of-type(2n){animation-delay:-1.1s}.constel circle:nth-of-type(3n){animation-delay:-2s}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:0 0 26px}
.rule{width:56px;height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.lead{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;color:var(--muted);font-size:1.15rem;margin:22px 0 6px}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(2.8rem,10vw,4.4rem);line-height:1;margin:0;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff6e3,var(--cream) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:"Cormorant Garamond",serif;letter-spacing:.5em;font-size:.95rem;color:var(--gold);margin:14px 0 0;padding-left:.5em}
.sub{margin:26px 0 30px;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid rgba(212,176,106,.22);border-bottom:1px solid rgba(212,176,106,.22);padding:22px 0;margin-bottom:34px}
.details div{padding:0 8px}.details div+div{border-left:1px solid rgba(212,176,106,.18)}
.details small{display:block;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--brown);margin-bottom:8px}
.details span{font-family:"Cormorant Garamond",serif;font-size:1.2rem;line-height:1.25;color:var(--cream)}
form{display:flex;flex-direction:column;gap:14px;align-items:center}
label{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--brown)}
input{width:100%;max-width:340px;background:rgba(6,5,9,.45);border:1px solid rgba(212,176,106,.28);border-radius:14px;
  padding:15px 18px;color:var(--cream);font:400 1rem "Source Sans 3",sans-serif;text-align:center;outline:none;transition:border-color .3s,box-shadow .3s}
input::placeholder{color:rgba(185,166,138,.5)}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,176,106,.12),0 0 24px rgba(212,176,106,.18)}
button{position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--gold);border-radius:999px;padding:14px 38px;
  font:500 .72rem "Source Sans 3",sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#1a1208;
  background:linear-gradient(135deg,#f1d9a0,var(--gold) 55%,#b48f4e);box-shadow:0 8px 30px rgba(212,176,106,.28);transition:transform .25s,box-shadow .25s}
button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
button:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(212,176,106,.4)}button:hover::after{left:130%}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.note{min-height:1.4em;margin:6px 0 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.1rem;color:var(--gold)}
.confirmed{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{margin-top:26px;font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--brown)}
@media (max-width:520px){.card{padding:48px 22px 36px}.details{grid-template-columns:1fr;gap:18px}.details div+div{border-left:0;border-top:1px solid rgba(212,176,106,.18);padding-top:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="galaxy" aria-hidden="true"><canvas></canvas></div>
<div class="glow" aria-hidden="true"></div>
<main>
  <section class="card" id="card" aria-label="Graduation invitation">
    
    

    <p class="eyebrow">Class of 2026</p>
    <div class="rule"></div>
    <p class="lead">You are warmly invited to celebrate the graduation of</p>
    <h1>Philip Ndege</h1>
    <p class="tag">#PILOT</p>
    <p class="sub">Bachelor of Science in Computer Science</p>

    <div class="details">
      <div><small>Date</small><span>18th December<br>2026</span></div>
      <div><small>Time</small><span>8:00 AM<br>to 5:00 PM</span></div>
      <div><small>Venue</small><span>Kabarak<br>University</span></div>
    </div>

    <form id="rsvp" novalidate>
      <label for="name">Kindly confirm your attendance</label>
      <input id="name" name="name" type="text" placeholder="Your full name" autocomplete="name" maxlength="60" required>
      <button type="submit">Confirm</button>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </form>
    <p class="foot">Under a sky full of stars</p>
  </section>
</main>

<script>
(function(){
  var cv=document.getElementById('sky'),ctx=cv.getContext('2d'),stars=[],W,H,dpr=Math.min(window.devicePixelRatio||1,2),mx=0,my=0,tx=0,ty=0;
  var cols=['255,244,222','212,176,106','190,212,240','243,233,214'];
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/5200);stars=[];
    for(var i=0;i<n;i++){stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,z:Math.random()*.9+.1,
      c:cols[Math.random()<.5?0:Math.floor(Math.random()*4)],p:Math.random()*6.28,s:Math.random()*.02+.004})}}
  function draw(t){
    mx+=(tx-mx)*.04;my+=(ty-my)*.04;ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){var s=stars[i],a=.35+.65*Math.abs(Math.sin(s.p+t*s.s));
      var x=(s.x+mx*s.z*18+W)%W,y=(s.y+my*s.z*18+H)%H;
      ctx.beginPath();ctx.fillStyle='rgba('+s.c+','+(a*s.z).toFixed(3)+')';ctx.arc(x,y,s.r,0,6.283);ctx.fill();
      if(s.r>1.1){ctx.shadowColor='rgba('+s.c+',.8)';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0}}
    if(cv.isConnected)requestAnimationFrame(draw)}
  size();addEventListener('resize',size);requestAnimationFrame(draw);

  var card=document.getElementById('card');
  addEventListener('pointermove',function(e){
    var nx=e.clientX/W-.5,ny=e.clientY/H-.5;tx=nx;ty=ny;
    if(matchMedia('(hover:hover)').matches){card.style.transform='rotateY('+(nx*5)+'deg) rotateX('+(-ny*5)+'deg)'}});
  addEventListener('pointerleave',function(){card.style.transform='';tx=ty=0});

  var form=document.getElementById('rsvp'),input=document.getElementById('name'),note=document.getElementById('note');
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function show(n){note.className='note confirmed';note.innerHTML='With gratitude, '+esc(n)+'. Your place is noted.'}
  try{var saved=localStorage.getItem('rsvp-name');if(saved){input.value=saved;show(saved)}}catch(e){}
  form.addEventListener('submit',function(e){
    e.preventDefault();var n=input.value.trim();
    if(!n){note.className='note';note.textContent='Please enter your name to confirm.';input.focus();return}
    var btn=form.querySelector('button');btn.disabled=true;
    note.className='note';note.textContent='Sending your confirmation...';
    fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok||!d.ok)throw new Error()})})
      .then(function(){try{localStorage.setItem('rsvp-name',n)}catch(e){}show(n);btn.disabled=false})
      .catch(function(){note.className='note';note.textContent='Something went wrong. Please try again.';btn.disabled=false});
  });
})();
</script>
<script>
(function(){
  var host=document.getElementById('galaxy'),cv=host.firstElementChild;
  var gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false});
  if(!gl){host.remove();return}
  var VS='#version 300 es\nin vec2 aPosition;\nvoid main(){gl_Position=vec4(aPosition,0.0,1.0);}';
  var FS=`#version 300 es
precision highp float;
precision highp int;
uniform float uTime;uniform vec2 uResolution;uniform vec2 uFocal;uniform vec2 uRotation;uniform float uGloss;uniform float uDepth;uniform float uDensity;uniform float uHueShift;uniform float uSpeed;uniform vec2 uMouse;uniform float uStarGlow;uniform float uFlareGain;uniform float uSquash;uniform float uSaturation;uniform float uMouseRepulsion;uniform float uTwinkleIntensity;uniform float uRotationAngle;uniform float uRepulsionStrength;uniform float uMouseActiveFactor;uniform float uAutoCenterRepulsion;uniform int uLayers;uniform vec3 uColors[4];uniform int uColorCount;uniform float uWarp;uniform float uReveal;uniform float uMode;uniform vec3 uBackground;uniform float uOpacity;
out vec4 outColor;
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0
float Hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float tri(float x){return abs(fract(x)*2.0-1.0);}
float tris(float x){float t=fract(x);return 1.0-smoothstep(0.0,1.0,abs(2.0*t-1.0));}
float trisn(float x){float t=fract(x);return 2.0*(1.0-smoothstep(0.0,1.0,abs(2.0*t-1.0)))-1.0;}
float Star(vec2 uv,float flare,vec2 radial,float invReach){
  float along=dot(uv,radial);
  float d=sqrt(max(dot(uv,uv)-uSquash*along*along,0.0));
  float m=uStarGlow/d;
  float rays=smoothstep(0.0,1.0,1.0-abs(uv.x*uv.y*1000.0));
  m+=rays*flare*uFlareGain;
  uv*=MAT45;
  rays=smoothstep(0.0,1.0,1.0-abs(uv.x*uv.y*1000.0));
  m+=rays*0.3*flare*uFlareGain;
  m*=smoothstep(1.0,0.2,d*invReach);
  m*=mix(1.0,smoothstep(1.0,0.55,length(uv)*invReach),min(uWarp*4.0,1.0));
  return m;
}
vec3 StarLayer(vec2 uv,vec2 radial,vec2 repelAt,float pushCells,float spread){
  vec3 col=vec3(0.0);
  vec2 gv=fract(uv)-0.5;
  vec2 id=floor(uv);
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      vec2 offset=vec2(float(x),float(y));
      vec2 si=id+offset;
      float seed=Hash21(si);
      float size=fract(seed*345.32);
      float glossLocal=tri(uGloss/(PERIOD*seed+1.0));
      float flareSize=smoothstep(0.9,1.0,size)*glossLocal;
      float pick=Hash21(si+7.0)*float(uColorCount);
      vec3 base=uColors[int(min(floor(pick),float(uColorCount-1)))];
      vec2 pad=vec2(tris(seed*34.0+uTime*uSpeed/10.0),tris(seed*38.0+uTime*uSpeed/30.0))-0.5;
      vec2 away=si+0.5+pad-repelAt;
      float dist=length(away);
      float q=dist*spread;
      float cells=pushCells*exp(-q*q);
      float moved=cells*inversesqrt(1.0+cells*cells*2.78);
      vec2 shift=away*(moved/max(dist,0.0001));
      float invReach=1.0/(1.0-moved);
      float star=Star(gv-offset-pad-shift,flareSize,radial,invReach);
      float twinkle=trisn(uTime*uSpeed+seed*6.2831)*0.5+1.0;
      twinkle=mix(1.0,twinkle,uTwinkleIntensity);
      col+=star*twinkle*size*base;
    }
  }
  return col;
}
void main(){
  vec2 focalPx=uFocal*uResolution;
  vec2 uv=(gl_FragCoord.xy-focalPx)/uResolution.y;
  vec2 repelAt=vec2(0.0);
  float strength=0.0;
  float push=0.0;
  if(uMouseRepulsion>0.5){
    repelAt=(uMouse*uResolution-focalPx)/uResolution.y;
    strength=max(uRepulsionStrength,0.0);
    push=strength*0.05*uMouseActiveFactor;
  }
  float radius=0.16+0.04*strength;
  vec2 radial=length(uv)>0.0001?normalize(uv):vec2(1.0,0.0);
  float a=uRotationAngle;
  mat2 R1=mat2(cos(a),-sin(a),sin(a),cos(a));
  mat2 R2=mat2(uRotation.x,-uRotation.y,uRotation.y,uRotation.x);
  uv=R2*(R1*uv);radial=R2*(R1*radial);repelAt=R2*(R1*repelAt);
  vec3 col=vec3(0.0);
  float layers=float(uLayers);
  for(int k=0;k<8;k++){
    if(k>=uLayers)break;
    float i=float(k)/layers;
    float depth=fract(i+uDepth);
    float scale=mix(20.0*uDensity,0.5*uDensity,depth);
    float fade=depth*smoothstep(1.0,0.9,depth);
    vec2 offset=vec2(i*453.32);
    col+=StarLayer(uv*scale+offset,radial,repelAt*scale+offset,push*scale,1.0/(scale*radius))*fade;
  }
  col*=uReveal;
  float alpha=min(smoothstep(0.0,0.3,length(col)),1.0)*uOpacity;
  outColor=vec4(col*alpha,alpha);
}`;
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS.replace('\n','\n')));
  gl.bindAttribLocation(pr,0,'aPosition');gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){host.remove();return}
  var vao=gl.createVertexArray();gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  var U={};['uTime','uResolution','uFocal','uRotation','uGloss','uDepth','uDensity','uHueShift','uSpeed','uMouse','uStarGlow','uFlareGain','uSquash','uSaturation','uMouseRepulsion','uTwinkleIntensity','uRotationAngle','uRepulsionStrength','uMouseActiveFactor','uAutoCenterRepulsion','uLayers','uColors[0]','uColorCount','uWarp','uReveal','uMode','uBackground','uOpacity'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n)});
  var P={density:1.4,glow:0.63,flare:2.6,starSpeed:0.5,speed:0.7,rot:0.06,twinkle:0.6,repel:1.5,layers:4};
  var cols=new Float32Array([1,1,1, 1,0.851,0.639, 0.659,0.784,1, 0,0,0]);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S={time:0,gloss:0,depth:0,angle:0,mx:.5,my:.5,active:0,boost:0,reveal:reduce?1:0};
  var ptr={x:.5,y:.5,inside:false},last=0,raf=0;
  function render(){
    gl.viewport(0,0,cv.width,cv.height);gl.useProgram(pr);gl.bindVertexArray(vao);
    var st=1+S.boost*5,f=Math.min(1,S.reveal/.35);
    gl.uniform1f(U.uTime,S.time);gl.uniform2f(U.uResolution,cv.width,cv.height);
    gl.uniform2f(U.uFocal,.5,.5);gl.uniform2f(U.uRotation,1,0);
    gl.uniform1f(U.uGloss,S.gloss);gl.uniform1f(U.uDepth,S.depth);gl.uniform1f(U.uDensity,P.density);
    gl.uniform1f(U.uHueShift,140);gl.uniform1f(U.uSpeed,P.speed);gl.uniform2f(U.uMouse,S.mx,S.my);
    gl.uniform1f(U.uStarGlow,0.05*P.glow/Math.pow(st,.6));gl.uniform1f(U.uFlareGain,P.glow*P.flare);
    gl.uniform1f(U.uSquash,1-1/(st*st));gl.uniform1f(U.uSaturation,0);gl.uniform1f(U.uMouseRepulsion,1);
    gl.uniform1f(U.uTwinkleIntensity,P.twinkle);gl.uniform1f(U.uRotationAngle,S.angle);
    gl.uniform1f(U.uRepulsionStrength,P.repel);gl.uniform1f(U.uMouseActiveFactor,S.active);
    gl.uniform1f(U.uAutoCenterRepulsion,0);gl.uniform1i(U.uLayers,P.layers);
    gl.uniform3fv(U['uColors[0]'],cols);gl.uniform1i(U.uColorCount,3);
    gl.uniform1f(U.uWarp,S.boost);gl.uniform1f(U.uReveal,f*f*(3-2*f));
    gl.uniform1f(U.uMode,1);gl.uniform3fv(U.uBackground,[0,0,0]);gl.uniform1f(U.uOpacity,1);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  function frame(now){
    raf=0;if(document.hidden)return;
    var dt=last?Math.min(.05,Math.max(.0005,(now-last)/1000)):1/60;last=now;
    if(S.reveal<1){S.reveal=Math.min(1,S.reveal+dt/2.2);S.boost=Math.max(S.boost,Math.pow(1-S.reveal,2)*1.4)}
    var fl=P.starSpeed/10;
    S.time+=dt;S.gloss+=dt*fl;S.depth+=dt*fl*P.speed*(1+S.boost*14);S.angle+=dt*P.rot;
    S.boost*=Math.exp(-dt*1.3);if(S.boost<.001)S.boost=0;
    var fo=1-Math.exp(-dt/.325);
    if(ptr.inside){S.mx+=(ptr.x-S.mx)*fo;S.my+=(ptr.y-S.my)*fo}
    S.active+=((ptr.inside?1:0)-S.active)*fo;
    render();raf=requestAnimationFrame(frame);
  }
  function wake(){if(!raf&&!reduce&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function resize(){var r=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(host.clientWidth*r));cv.height=Math.max(1,Math.round(host.clientHeight*r));render()}
  function loc(e){ptr.inside=true;ptr.x=e.clientX/Math.max(1,innerWidth);ptr.y=1-e.clientY/Math.max(1,innerHeight)}
  addEventListener('pointermove',loc,{passive:true});
  addEventListener('pointerdown',function(e){loc(e);if(!reduce)S.boost=Math.min(1.6,S.boost+1)},{passive:true});
  addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')ptr.inside=false},{passive:true});
  document.documentElement.addEventListener('pointerleave',function(){ptr.inside=false});
  document.addEventListener('visibilitychange',wake);
  addEventListener('resize',resize);
  resize();wake();
  var old=document.getElementById('sky');if(old)old.remove();
})();
</script>
</body>
</html>
